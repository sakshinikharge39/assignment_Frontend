<div class="app-layout">
  <!-- Global App Header -->
  <app-header></app-header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="container">
      <!-- Title & Action Bar -->
      <section class="action-hero">
        <div class="hero-text">
          <h2 class="page-title">Personal Task Planner</h2>
          <p class="page-desc">
            Organize priorities, track deadlines, and update progress quickly.
          </p>

          <!-- Overdue Alert Callout (if any tasks are overdue) -->
          @if (overdueNotice()) {
            <div
              class="overdue-callout"
              role="alert"
              (click)="filterForOverdue()"
              tabindex="0"
              title="Click to view all overdue tasks"
              (keydown.enter)="filterForOverdue()"
            >
              <span class="callout-icon" aria-hidden="true">⚠️</span>
              <span class="callout-text">{{ overdueNotice() }}</span>
              <span class="callout-action">View Overdue →</span>
            </div>
          }
        </div>

        <!-- Primary Action Button (Desktop & Tablet) -->
        <button
          type="button"
          class="btn-new-task"
          (click)="openCreateModal()"
          aria-label="Create a new task"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>New Task</span>
        </button>
      </section>

      <!-- Filter, Search, and Sort Bar -->
      <app-filter-bar></app-filter-bar>

      <!-- Task Cards List & Skeleton / Empty States -->
      <app-task-list
        (selectTask)="onSelectTask($event)"
        (editTask)="onEditTask($event)"
        (createTask)="openCreateModal()"
      ></app-task-list>
    </div>
  </main>

  <!-- Mobile Floating Action Button (FAB) for thumb reachability -->
  <button
    type="button"
    class="mobile-fab"
    (click)="openCreateModal()"
    aria-label="Create new task (quick add)"
  >
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Task Detail Drawer / Modal -->
  @if (selectedTask()) {
    <app-task-detail
      [task]="selectedTask()!"
      (close)="closeDetailDrawer()"
      (edit)="onEditTask($event)"
    ></app-task-detail>
  }

  <!-- Task Create / Edit Form Modal -->
  @if (isCreateModalOpen()) {
    <app-task-form
      [taskToEdit]="editingTask()"
      (formClosed)="closeFormModal()"
      (formSaved)="onFormSaved($event)"
    ></app-task-form>
  }

  <!-- Toast Notification Center -->
  <app-toast></app-toast>
</div>
