<header class="app-header">
  <div class="container header-container">
    <!-- Brand / Title -->
    <div class="brand-section">
      <div class="brand-icon" aria-hidden="true">
        <i class="fa-solid fa-list-check"></i>
      </div>
      <div class="brand-titles">
        <h1 class="brand-name">TaskPlanner</h1>
        <span class="brand-subtitle">Personal Work Manager</span>
      </div>
    </div>


    <!-- Top Actions & Failure Simulation Switch -->
    <div class="header-actions">
      <!-- Visible Failure Simulation Control -->
      <div class="simulation-control" [class.simulation-active]="failNextSave()">
        <label for="fail-save-toggle" class="simulation-label">
          <span class="label-text">Simulate Save Failure</span>
          <span class="simulation-indicator" [class.active]="failNextSave()">
            {{ failNextSave() ? 'ON' : 'OFF' }}
          </span>
        </label>
        <button
          type="button"
          id="fail-save-toggle"
          class="switch-btn"
          role="switch"
          [attr.aria-checked]="failNextSave()"
          (click)="toggleFailureSimulation()"
          title="Toggle failure simulation for testing failed save recovery"
        >
          <span class="switch-thumb"></span>
        </button>
      </div>

      <!-- Reset Demo Data -->
      <button
        type="button"
        class="btn-reset"
        (click)="onResetData()"
        title="Reset to default seeded demo tasks"
      >
        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
        <span class="btn-text">Reset Demo</span>
      </button>
    </div>
  </div>

  <!-- Prominent banner when failure simulation is active -->
  @if (failNextSave()) {
    <div class="simulation-banner" role="status" aria-live="polite">
      <div class="container banner-inner">
        <i class="fa-solid fa-triangle-exclamation banner-icon" aria-hidden="true"></i>
        <span class="banner-message">
          <strong>Save Failure Mode is ACTIVE:</strong> Any attempt to create or edit tasks will simulate a network/server failure. This allows you to verify form recovery and the retry mechanism.
        </span>
        <button type="button" class="banner-dismiss" (click)="toggleFailureSimulation()">
          Disable Failure Mode
        </button>
      </div>
    </div>
  }
</header>
