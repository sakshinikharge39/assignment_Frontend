<div class="filter-bar">
  <!-- Search and Sort Controls -->
  <div class="controls-row">
    <!-- Search Bar -->
    <div class="search-box">
      <span class="search-icon" aria-hidden="true">
        <i class="fa-solid fa-magnifying-glass"></i>
      </span>
      <input
        type="search"
        class="search-input"
        placeholder="Search tasks by title or details..."
        [value]="searchQuery()"
        (input)="onSearchChange($event)"
        aria-label="Search tasks"
      />
      @if (searchQuery()) {
        <button
          type="button"
          class="search-clear-btn"
          (click)="clearSearch()"
          aria-label="Clear search query"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      }
    </div>

    <!-- Sort Dropdown & Order Toggle -->
    <div class="sort-controls">
      <label for="sort-select" class="sort-label">Sort by:</label>
      <div class="select-wrapper">
        <select
          id="sort-select"
          class="sort-select"
          [value]="sortField()"
          (change)="onSortChange($event)"
        >
          <option value="dueDate">Due Date</option>
          <option value="priority">Priority</option>
          <option value="title">Title</option>
          <option value="status">Status</option>
        </select>
      </div>

      <button
        type="button"
        class="sort-dir-btn"
        (click)="toggleSortDirection()"
        [attr.title]="sortDirection() === 'asc' ? 'Sort Ascending (Click for Descending)' : 'Sort Descending (Click for Ascending)'"
        [attr.aria-label]="sortDirection() === 'asc' ? 'Sorted ascending' : 'Sorted descending'"
      >
        <span class="sort-dir-icon">
          {{ sortDirection() === 'asc' ? '↑' : '↓' }}
        </span>
        <span class="sort-dir-text">
          {{ sortDirection() === 'asc' ? 'Asc' : 'Desc' }}
        </span>
      </button>
    </div>
  </div>

  <!-- Filter Chips (Touch-friendly and Horizontally Scrollable on Mobile) -->
  <div class="chips-container" role="tablist" aria-label="Task status filters">
    @for (tab of filterTabs; track tab.id) {
      <button
        type="button"
        class="filter-chip"
        role="tab"
        [class.active]="currentFilter() === tab.id"
        [class.chip-overdue]="tab.id === 'overdue'"
        [class.has-overdue]="tab.id === 'overdue' && getBadgeCount('overdue') > 0"
        [attr.aria-selected]="currentFilter() === tab.id"
        (click)="onSelectFilter(tab.id)"
      >
        @if (tab.iconClass) {
          <i [class]="tab.iconClass" class="chip-icon" aria-hidden="true"></i>
        }
        <span class="chip-label">{{ tab.label }}</span>
        <span class="chip-badge" [class.badge-active]="currentFilter() === tab.id">
          {{ getBadgeCount(tab.id) }}
        </span>
      </button>
    }
  </div>
</div>
